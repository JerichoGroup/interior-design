# Exact conda environment used to run the aeic-compressing pipeline
# (both halves: the CPU encoder `encoder/run_onnx_npy.py` and the GPU decoder
# `decoder/decode.py`), captured with `conda env export -n aeic` on 2026-10-04.
#
#   conda env create -f environment.yml      # creates the env named `aeic`
#   conda activate aeic
#
# Hard constraints this env satisfies — do not drift from them:
#   * python 3.10  — the bundled rANS extensions are prebuilt
#     `MLCodec_{rans,CXX}.cpython-310-x86_64-linux-gnu.so`; any other CPython
#     version gives an ImportError (rebuild from decoder/cpp_src/ instead).
#   * diffusers 0.25.1 — base_model.py imports private 0.25.1-only module paths
#     (unet_2d_blocks / transformer_2d / resnet). Newer versions break the import.
#   * torch 2.1.2 as the CUDA 12.1 build. The PyPI 2.1.2 wheel is cu121 and pulls
#     the nvidia-*-cu12 deps listed below. If a CPU wheel gets installed, torch
#     reports no usable GPU and the decoder silently falls back to CPU; fix with
#     pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cu121
#   * exported WITHOUT build strings (--no-builds) so it also resolves on other
#     Linux boxes. For a bit-exact clone use `conda env export -n aeic` instead.
#
# `prefix:` was stripped on purpose (it hardcodes /home/maxim/miniconda3/envs/aeic).
# This is a superset: the env also carries packages from unrelated work (gradio,
# streamlit, pyiqa, ...). environment-minimal.yml is the trimmed version that only
# lists what encode + decode + the benchmarks actually import.
name: aeic
channels:
  - conda-forge
  - defaults
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.5.20
